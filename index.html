<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Goals · Habits + ML</title>
  <meta name="description" content="A habit system built on Atomic Habits: your daily habits and two ML courses by October 31, with a visible chain, an email for every completion and a contract that makes skipping cost." />
  <meta name="theme-color" content="#0b0d17" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Goals" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=Caveat:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="" width="38" height="38" />
      <div>
        <div class="brand-title">Goals</div>
        <div class="brand-sub" id="today-label"></div>
      </div>
    </div>
    <div class="top-right">
      <a class="streak-pill" id="streak" href="#tracker" aria-label="Current streak"></a>
      <div class="countdown" id="countdown"></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="today" aria-selected="true"><span class="ti">◎</span>Today</button>
    <button role="tab" data-tab="habits" aria-selected="false"><span class="ti">✓</span>Habits</button>
    <button role="tab" data-tab="courses" aria-selected="false"><span class="ti">☰</span>Courses</button>
    <button role="tab" data-tab="tracker" aria-selected="false"><span class="ti">⛓</span>Progress</button>
    <button role="tab" data-tab="settings" aria-selected="false"><span class="ti">⚙</span>More</button>
  </nav>

  <main id="app" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script type="module" src="js/app.js"></script>
</body>
</html>
